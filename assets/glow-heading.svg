<svg width="700" height="130" viewBox="0 0 700 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>

  <text x="50%" y="55" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="42" font-weight="700" fill="url(#neon)" filter="url(#glow)">
    Shivanshu Jha
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <text x="50%" y="95" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="18" fill="#FFA500" filter="url(#glow)" opacity="0.85">
    Aspiring Software Developer · Competitive Programmer
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
